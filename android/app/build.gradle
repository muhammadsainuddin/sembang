plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}
def signingFile = rootProject.file('.signing/signing.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
def serverUrl = providers.gradleProperty('serverUrl').getOrElse('https://private.aigeo.my')
android {
    namespace 'my.aigeo.zbuddy'
    compileSdk 36
    defaultConfig {
        applicationId 'my.aigeo.private'
        minSdk 26
        targetSdk 35
        versionCode 1141
        versionName '1.14.1'
        buildConfigField 'String', 'DEFAULT_SERVER', groovy.json.JsonOutput.toJson(serverUrl)
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file('.signing/sembang.jks')
                storePassword signingValues.getProperty('storePassword')
                keyAlias signingValues.getProperty('keyAlias')
                keyPassword signingValues.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.1.0')
    implementation 'com.google.firebase:firebase-messaging'
    testImplementation 'junit:junit:4.13.2'
}
