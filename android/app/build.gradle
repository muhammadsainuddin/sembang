plugins { id 'com.android.application' }
def signingFile = rootProject.file('.signing/signing.properties')
def signingValues = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
def serverUrl = providers.gradleProperty('serverUrl').getOrElse('')
android {
    namespace 'com.sembang.app'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sembang.app'
        minSdk 26
        targetSdk 35
        versionCode 130
        versionName '1.3.0'
        buildConfigField 'String', 'DEFAULT_SERVER', groovy.json.JsonOutput.toJson(serverUrl)
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file('.signing/sembang.jks')
                storePassword signingValues.getProperty('storePassword')
                keyAlias signingValues.getProperty('keyAlias')
                keyPassword signingValues.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
    testImplementation 'junit:junit:4.13.2'
}
