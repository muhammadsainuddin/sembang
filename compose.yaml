name: sembang
services:
  sembang:
    build: .
    image: sembang-node:1.4.0
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 25s
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    env_file: ${SEMBANG_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      COOKIE_SECURE: 'true'
      EMAIL_VERIFICATION_REQUIRED: 'true'
      APP_ORIGIN: https://${SEMBANG_DOMAIN:?Set SEMBANG_DOMAIN in .env}
      TRUST_PROXY: ${CADDY_IP:-172.29.241.2}/32
    volumes:
      - sembang_data:/app/data
    expose: ['3000']
    networks: [sembang_net]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 192m
    environment:
      SEMBANG_DOMAIN: ${SEMBANG_DOMAIN:?Set SEMBANG_DOMAIN in .env}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    networks:
      sembang_net:
        ipv4_address: ${CADDY_IP:-172.29.241.2}
    depends_on:
      sembang: {condition: service_healthy}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
volumes:
  sembang_data:
    name: ${SEMBANG_DATA_VOLUME:-sembang_data}
  caddy_data:
    name: sembang_caddy_data
  caddy_config:
    name: sembang_caddy_config
networks:
  sembang_net:
    ipam:
      config:
        - subnet: ${SEMBANG_SUBNET:-172.29.241.0/24}
